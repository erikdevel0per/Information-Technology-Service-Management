name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests and H2 integration tests
        run: mvn -B -ntp verify

  databases:
    name: Database compatibility (Docker)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the persistence suite against PostgreSQL, MySQL, MariaDB, SQL Server and Oracle
        run: >
          mvn -B -ntp -pl pyhoma-infrastructure -am verify
          -Dtest=DatabaseCompatibilityTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dpyhoma.databases=postgresql,mysql,mariadb,sqlserver,oracle
